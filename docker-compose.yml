version: '3.9'
services:
  postgres:
    image: postgres:15
    container_name: trading-journal-postgres
    environment:
      POSTGRES_DB: trading_journal
      POSTGRES_USER: trading_user
      POSTGRES_PASSWORD: trading_password
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U trading_user']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: trading-journal-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/trading_journal
      SPRING_DATASOURCE_USERNAME: trading_user
      SPRING_DATASOURCE_PASSWORD: trading_password
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - '8080:8080'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8080/actuator/health']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  frontend:
    build: ./frontend
    container_name: trading-journal-frontend
    depends_on:
      - backend
    ports:
      - '3000:80'

volumes:
  postgres-data:
