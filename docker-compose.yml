version: '3.9'
services:
  postgres:
    image: postgres:15
    container_name: trading-journal-postgres
    environment:
      POSTGRES_DB: trading_journal
      POSTGRES_USER: trading_user
      POSTGRES_PASSWORD: trading_password
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U trading_user']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
