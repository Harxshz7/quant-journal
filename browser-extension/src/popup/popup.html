<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quant Journal Logger</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="logo">QJ</div>
      <div>
        <h1>Quant Journal</h1>
        <p class="subtitle">Log trades from TradingView</p>
      </div>
    </header>

    <div id="login-view" class="view">
      <form id="login-form">
        <label for="base-url">API URL</label>
        <input id="base-url" type="text" placeholder="http://localhost:8080" />
        <label for="email">Email</label>
        <input id="email" type="email" placeholder="you@example.com" autocomplete="email" required />
        <label for="password">Password</label>
        <input id="password" type="password" placeholder="••••••••" autocomplete="current-password" required />
        <button id="login-btn" type="submit">Sign In</button>
        <div id="login-message" class="message"></div>
      </form>
    </div>

    <div id="main-view" class="view" style="display:none;">
      <div id="user-line" class="user-line"></div>
      <label for="account-select">Active Account</label>
      <select id="account-select"></select>
      <div id="account-message" class="message"></div>
      <button id="refresh-btn" type="button" class="secondary">Refresh Accounts</button>
      <button id="logout-btn" type="button" class="secondary">Sign Out</button>
      <p class="hint">Open TradingView, click the "Quant Journal" button, and log your trade from the floating panel.</p>
    </div>
  </div>
  <script type="module" src="popup.js"></script>
</body>
</html>
