spring:
  config:
    activate:
      on-profile: dev
  profiles:
    active: dev

  datasource:
    url: jdbc:postgresql://localhost:5432/trading_journal
    username: trading_user
    password: trading_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

logging:
  level:
    root: INFO
    org.springframework: INFO
    com.tradingjournal: DEBUG
