# Used inside the Docker Compose network (hostname is "postgres", not localhost)
spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/trading_journal
    username: trading_user
    password: trading_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}

logging:
  level:
    root: INFO
    com.tradingjournal: INFO
