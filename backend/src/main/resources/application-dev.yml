# Local development — set your PostgreSQL credentials below
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/trading_journal
    username: your_db_username
    password: your_db_password
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

logging:
  level:
    root: INFO
    org.springframework: INFO
    com.tradingjournal: DEBUG
    org.hibernate.SQL: DEBUG
