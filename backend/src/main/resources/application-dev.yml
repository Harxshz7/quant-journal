spring:
  datasource:
    url: jdbc:h2:mem:trading_journal;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080

jwt:
  # Dev-only signing key. Production MUST override via JWT_SECRET env var (see application-prod.yml).
  secret: ${JWT_SECRET:dev-only-insecure-signing-key-change-me-2026}

logging:
  level:
    root: INFO
    org.springframework: INFO
    com.tradingjournal: DEBUG
    org.hibernate.SQL: DEBUG
